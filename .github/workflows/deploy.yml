# .github/workflows/deploy.yml
name: Deploy Next.js Static Site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy via LFTP
        uses: haukurh/lftp-action@v1
        with:
          ftp_user: "santigf12"
          ftp_host: ${{ secrets.SSH_HOST }}
          ftp_port: ${{ secrets.SSH_PORT }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          ftp_protocol: sftp
          disable_strict_host_key_checking: "true"
          commands: mirror --continue --reverse --delete --parallel=8 --verbose out/ /pages-fuentes-it-com/
